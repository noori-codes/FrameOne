info:
  name: Trending movies
  type: http
  seq: 6

http:
  method: GET
  url: "{{tmdb_base_url}}/trending/movie/day?api_key={{tmdb_api_key}}&page=1"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

docs: |-
  Same as getTrendingMovies("day") in lib/tmdb.ts.
  Swap /day for /week to match getTrendingMovies("week").
