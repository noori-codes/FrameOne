info:
  name: Authentication (Bearer)
  type: http
  seq: 3

http:
  method: GET
  url: "{{tmdb_base_url}}/authentication"
  auth:
    type: bearer
    token: "{{tmdb_access_token}}"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

docs: |-
  Optional. Needs tmdb_access_token set in the local environment.
  Do not also put api_key on this request.
