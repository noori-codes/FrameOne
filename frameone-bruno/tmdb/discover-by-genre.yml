info:
  name: Discover by genre
  type: http
  seq: 9

http:
  method: GET
  url: "{{tmdb_base_url}}/discover/movie?api_key={{tmdb_api_key}}&with_genres=28&sort_by=popularity.desc&page=1&include_adult=false"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

docs: |-
  Same as getMoviesByGenre(28) — 28 is Action.
  Change with_genres to another id from Movie genres.
